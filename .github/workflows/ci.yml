name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
        if: runner.os != 'Windows'
      - run: pnpm test
      - name: Smoke test the CLI bundle
        shell: bash
        run: |
          node packages/cli/dist/index.js --version
          SINDAR_HOME="$RUNNER_TEMP/sindar-home" node packages/cli/dist/index.js --lang en doctor --no-probe
